name: Security and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-gmail.txt pip-audit
      - run: python -m pytest -q
      - run: node --test tests/extension_security.test.cjs
      - run: pip-audit --format cyclonedx-json --output dependency-audit.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.cdx.json
